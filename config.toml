# ── Hardware
# One knob. Set your GPU's VRAM class.
#   "4GB"  — small cards (GTX 1650, RTX 3050 laptop, ...)
#   "8GB"  — mainstream cards (RTX 3060 / 4060, ...)
#   "cpu"  — no CUDA GPU; CPU inference

[hardware]
vram = "8GB"
vram_headroom_mib = 0    # VRAM to leave unclaimed for the GPU driver and the
                         # rest of the desktop; 0 = built-in default (1024).
                         # It trades against context steeply — roughly 100
                         # tokens of window per MiB at q4_0 on this model, so
                         # 512 here would roughly double the context at the
                         # cost of half the safety margin.
kv_cache = "q4_0"        # KV-cache quantization: "q8_0" | "q4_0" | "f16" | ""
                         # ("" = tier default, q8_0). Measured on this box with
                         # the 9B: q8_0 costs 0.0175 MiB/token, q4_0 0.0094 —
                         # q4_0 roughly doubles the context that fits. Needle
                         # recall over a ~21k-token prompt was 3/3 on both.

[server]
port = 8090

[llama]
binary = ""              # auto-detect if empty
port = 8079
startup_timeout = 120
cache_reuse = 256        # --cache-reuse: min KV chunk (tokens) to salvage via
                         # cache shift after an edit mid-prompt; 0 = off.
                         # Verified on build 9870 with q8_0 KV + flash-attn:
                         # exact-prefix reuse works, and shifted-chunk salvage
                         # too (a 272-token RAG block moving position cost only
                         # 227 tokens of re-prefill for the whole turn).

# ── Tools
# Agentic tool execution — runs model-generated code locally, on purpose.
# workspace roots the filesystem tools (read/write/edit/list/glob/grep) and is
# the working directory for run_bash/run_python; empty = fs tools refuse.
# bash: optional bash path; else Git Bash is autodetected (bare "bash" on
# Windows hits the System32 WSL relay, which fails without a distro).
#
# The declared tool set follows the [hardware] tier: "8GB" declares all ten
# tools (~1150 tokens of system prefix, one-time per conversation); "4GB" and
# "cpu" declare the six filesystem tools only (~760 tokens), and the exec
# tools (run_bash/run_python/save_tool/run_tool) are refused if called.
#
# The tier also caps reasoning_effort (see [defaults] below), since the
# stronger modes spend their budget on thinking tokens the smaller windows
# cannot hold: "8GB" uncapped, "4GB" capped at medium, "cpu" at low.

[tools]
enabled = true
workspace = ""
bash = ""

# ── Defaults
[defaults]
model = "Qwen3.5-9B-abliterated-Q4_K_M.gguf"   # must match a filename in models_dir exactly
models_dir = "models"
temperature = 0.7
top_k = 40
top_p = 0.9
repeat_penalty = 1.1
reasoning_effort = ""   # fallback for models that declare none; "" = leave the
                        # model on its own built-in default.

# ── Embed Server
# A second llama-server process dedicated to embeddings. GPU offload and context are derived
# from the [hardware] tier; only the model, port, and retrieval prefixes are set here.

[embed]
enabled = true
model = "Qwen3-Embedding-0.6B-Q8_0.gguf"
port = 8078
gpu_layers = -1          # -1 = follow the [hardware] tier (CPU on 8GB and below).
                         # Set 99 to embed on the GPU instead: measured on an
                         # RTX 5070 Laptop that is 24.8 chunks/s vs 2.9 on CPU,
                         # ~8x faster indexing — but it reserves ~1.4 GiB, which
                         # drops a 9B Q4 from 32 offloaded layers to 26 and cuts
                         # generation from 13.3 to 5.4 tok/s. Worth it only if
                         # you index far more than you chat.
startup_timeout = 30
pooling = ""             # auto-detect from GGUF metadata
query_prefix = "Instruct: Find code relevant to this description\nQuery: "
doc_prefix = ""

# ── RAG
# Indexes uploaded files into a local vector store using the embed server.
# Semantic search retrieves relevant code chunks and injects them into the
# prompt before generation.
#
# HNSW graph parameters (approximate nearest neighbor search):
# hnsw_m = max connections per node per layer (layer 0 gets 2×M)
# hnsw_ef_construction = beam width during index build
# hnsw_ef_search = beam width during query (higher = more accurate, slower)

[rag]
enabled = true
db_path = "data/rag_index.bin"
chunk_size = 60
chunk_overlap = 10
search_results = 5
min_similarity = 0.25
hybrid_weight_vector = 0.7
hybrid_weight_bm25 = 0.3
chunker_tool = "tools/chunker.py"
max_chunks_per_file = 200  # runaway guard on chunks from any ONE file, not a
                           # context control: retrieval injects search_results
                           # chunks per turn whatever the index size, so a
                           # bigger index costs no prompt tokens. It bounds
                           # embed time only, which is async and one-time.
                           # Measured over 21 real files (median 36 chunks,
                           # max 328): a cap of 40 indexed only 46% of them
                           # and kept imports while dropping implementations.
                           # Anything that trims an ordinary file is too low.
                           # 0 disables the cap.
hnsw_m = 16
hnsw_ef_construction = 150
hnsw_ef_search = 64

