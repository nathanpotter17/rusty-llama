# CodeWriter — config.toml

[server]
port = 8090

[llama]
binary = ""              # auto-detect if empty
port = 8079
parallel_slots = 1
startup_timeout = 120

[limits]
session_tokens = 0       # 0 = unlimited
daily_tokens = 0

[defaults]
model = ""               # auto-select first found
models_dir = "models"
gpu_layers = -1           # -1 = per-model default
context_size = 0          # 0 = per-model default
flash_attention = true
temperature = 0.7
top_k = 40
top_p = 0.9
repeat_penalty = 1.1

# KV cache quantization — shrinks VRAM usage for the context window.
# Valid values: "f16" (default), "q8_0", "q4_0", "q4_1"
# KV cache precision is INDEPENDENT of model weight quantization.
# The cache stores FP16 attention outputs regardless of weight quant.
# f16 = lossless (best quality), q8_0 = safe (~halves cache VRAM),
# q4_0/q4_1 = measurable degradation at long contexts, avoid for code.
# Leave empty for f16. Use q8_0 only if you need VRAM headroom.
cache_type_k = "q8_0"
cache_type_v = "q8_0"

# Speculative decoding — a small draft model proposes tokens that the
# main model verifies in a single pass. Highly effective for code where
# token sequences are predictable (boilerplate, closing braces, etc).
# draft_model must be a .gguf filename inside models_dir.
# draft_max = how many tokens the draft model proposes per step (2-16).
# gpu_layers_draft = GPU layers for the draft model (-1 = full offload).
draft_model = "qwen2.5-0.5b-instruct-q8_0.gguf"
draft_max = 10
gpu_layers_draft = 99

# ── Models ──────────────────────────────────────────────────
# Each [[models]] maps a .gguf filename to tuned params.
# Unknown .gguf files in models_dir still load with [defaults].

[[models]]
filename = "Qwen3-30B-A3B-Q4_K_M.gguf"
name = "Qwen3 30B A3B (Q4_K_M)"
family = "qwen"
gpu_layers = 15
context_size = 2048
temperature = 0.7
top_k = 40
top_p = 0.9
repeat_penalty = 1.1

[[models]]
filename = "qwen2.5-coder-14b-instruct-q4_k_m.gguf"
name = "Qwen2.5 Coder 14B Instruct"
family = "qwen"
gpu_layers = 15
context_size = 4096

[[models]]
filename = "qwen2.5-coder-7b-instruct-q4_k_m.gguf"
name = "Qwen2.5 Coder 7B Instruct"
family = "qwen"
gpu_layers = 16
context_size = 2048
temperature = 0.7
top_k = 40
top_p = 0.9
repeat_penalty = 1.1

[[models]]
filename = "Meta-Llama-3.1-8B-Instruct-Q5_K_M.gguf"
name = "Llama 3.1 8B Instruct"
family = "llama"
gpu_layers = 20
context_size = 4096
temperature = 0.6

[[models]]
filename = "gemma-2-9b-it-Q5_K_M.gguf"
name = "Gemma 2 9B IT (Q5)"
family = "gemma"
gpu_layers = 25
context_size = 4096
top_p = 0.95

[[models]]
filename = "gemma-2-9b-it-Q4_K_M.gguf"
name = "Gemma 2 9B IT"
family = "gemma"
gpu_layers = 20
context_size = 4096
top_p = 0.95

[[models]]
filename = "gemma-4-E4B-it-Q5_K_M.gguf"
name = "Gemma 4 E4B IT Q5KM"
family = "gemma"
gpu_layers = 25
context_size = 8192
temperature = 0.3
top_k = 20
top_p = 0.85
repeat_penalty = 1.0