# CodeWriter — config.toml

[server]
port = 8090

[llama]
binary = ""              # auto-detect if empty
port = 8079
parallel_slots = 1
startup_timeout = 120

[limits]
session_tokens = 0       # 0 = unlimited
daily_tokens = 0

[defaults]
model = ""               # auto-select first found
models_dir = "models"
gpu_layers = -1           # -1 = per-model default
context_size = 0          # 0 = per-model default
flash_attention = true
temperature = 0.7
top_k = 40
top_p = 0.9
repeat_penalty = 1.1

# KV cache quantization
cache_type_k = "q8_0"
cache_type_v = "q8_0"

# Speculative decoding
draft_model = ""
draft_max = 10
gpu_layers_draft = 99

# ── Embed Server ────────────────────────────────────────────
# A second llama-server process dedicated to embeddings.
# Runs on a separate port so the main model can generate while
# the embed model produces vectors. Both PIDs are managed by
# the main binary — start/stop from the settings panel or
# automatically on boot.

[embed]
enabled = true
model = "embeddinggemma-300m-Q8_0.gguf"
port = 8078
gpu_layers = 99           # full offload — only ~329 MB
context_size = 2048       # plenty for code chunks
parallel_slots = 1
startup_timeout = 30      # loads fast at 300M params

# ── RAG (Retrieval-Augmented Generation) ────────────────────
# Indexes uploaded files into a local LanceDB vector store using
# the embed server. Semantic search retrieves relevant code chunks
# and injects them into the prompt before generation.
#
# chunk_size = lines per chunk for code files
# chunk_overlap = overlapping lines between consecutive chunks
# search_results = number of chunks to retrieve per query
[rag]
enabled = true
db_path = "data/rag_index.json"
chunk_size = 60
chunk_overlap = 10
search_results = 3

# ── Models ──────────────────────────────────────────────────

[[models]]
filename = "qwen2.5-0.5b-instruct-q8_0.gguf"
name = "Qwen2.5 0.5B Instruct (Q8_0)"
