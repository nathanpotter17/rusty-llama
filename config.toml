# CodeWriter — config.toml

[server]
port = 8090

[llama]
binary = ""              # auto-detect if empty
port = 8079
parallel_slots = 1
startup_timeout = 120

[limits]
session_tokens = 0       # 0 = unlimited
daily_tokens = 0

[defaults]
model = ""               # auto-select first found
models_dir = "models"
gpu_layers = -1           # -1 = per-model default
context_size = 0          # 0 = per-model default
flash_attention = true
temperature = 0.7
top_k = 40
top_p = 0.9
repeat_penalty = 1.1

# KV cache quantization — shrinks VRAM usage for the context window.
# Valid values: "f16" (default), "q8_0", "q4_0", "q4_1"
# KV cache precision is INDEPENDENT of model weight quantization.
# The cache stores FP16 attention outputs regardless of weight quant.
# f16 = lossless (best quality), q8_0 = safe (~halves cache VRAM),
# q4_0/q4_1 = measurable degradation at long contexts, avoid for code.
# Leave empty for f16. Use q8_0 only if you need VRAM headroom.
cache_type_k = "q8_0"
cache_type_v = "q8_0"

# Speculative decoding — a small draft model proposes tokens that the
# main model verifies in a single pass. Highly effective for code where
# token sequences are predictable (boilerplate, closing braces, etc).
# draft_model must be a .gguf filename inside models_dir.
# draft_max = how many tokens the draft model proposes per step (2-16).
# gpu_layers_draft = GPU layers for the draft model (-1 = full offload).
# qwen2.5-0.5b-instruct-q8_0.gguf
draft_model = ""
draft_max = 10
gpu_layers_draft = 99

# ── Models ──────────────────────────────────────────────────
# Each [[models]] maps a .gguf filename to tuned params.
# Unknown .gguf files in models_dir still load with [defaults].
#
# Context sizes are increased to support uploading full code files.
# KV cache VRAM at q8_0 ≈ 2 × layers × heads × head_dim × ctx × 1B.
# Increase gpu_layers alongside ctx if your GPU has the VRAM headroom.

[[models]]
filename = "qwen2.5-0.5b-instruct-q8_0.gguf"
name = "Qwen2.5 0.5B Instruct (Q8_0)"
family = "qwen"
gpu_layers = 15
context_size = 32768
temperature = 0.5
top_k = 30
top_p = 0.85
repeat_penalty = 1.1

[[models]]
filename = "qwen2.5-coder-7b-instruct-q4_k_m.gguf"
name = "Qwen2.5 Coder 7B Instruct (Q4_K_M)"
family = "qwen"
gpu_layers = 16
context_size = 32768
temperature = 0.7
top_k = 40
top_p = 0.9
repeat_penalty = 1.1

[[models]]
filename = "gemma-3-1b-it-ab-Q5_K_M.gguf"
name = "Gemma 3 1B IT (Q5)"
family = "gemma"
gpu_layers = 25
context_size = 8192
temperature = 0.5
top_k = 0
top_p = 0.95
repeat_penalty = 1.0

[[models]]
filename = "gemma-3-4b-it-ab-Q4_K_M.gguf"
name = "Gemma 3 4B IT"
family = "gemma"
gpu_layers = 20
context_size = 8192
temperature = 0.7
top_k = 0
top_p = 0.95
repeat_penalty = 1.0

[[models]]
filename = "gemma-4-E4B-it-Q5_K_M.gguf"
name = "Gemma 4 E4B IT Q5KM"
family = "gemma"
gpu_layers = 25
context_size = 32768
temperature = 0.3
top_k = 20
top_p = 0.85
repeat_penalty = 1.0