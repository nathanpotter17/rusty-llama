# ── Hardware
# One knob. Set your GPU's VRAM class.
#   "4GB"  — small cards (GTX 1650, RTX 3050 laptop, ...)
#   "8GB"  — mainstream cards (RTX 3060 / 4060, ...)
#   "cpu"  — no CUDA GPU; CPU inference

[hardware]
vram = "4GB"

[server]
port = 8090

[llama]
binary = ""              # auto-detect if empty
port = 8079
startup_timeout = 120

# ── Defaults
[defaults]
model = "qwen2.5-coder-7b-instruct-q4_k_m.gguf"
models_dir = "models"
temperature = 0.7
top_k = 40
top_p = 0.9
repeat_penalty = 1.1

# ── Embed Server
# A second llama-server process dedicated to embeddings. GPU offload and context are derived
# from the [hardware] tier; only the model, port, and retrieval prefixes are set here.

[embed]
enabled = false
model = "Qwen3-Embedding-0.6B-Q8_0.gguf"
port = 8078
startup_timeout = 30
pooling = ""             # auto-detect from GGUF metadata
query_prefix = "Instruct: Find code relevant to this description\nQuery: "
doc_prefix = ""

# ── RAG
# Indexes uploaded files into a local vector store using the embed server.
# Semantic search retrieves relevant code chunks and injects them into the
# prompt before generation.
#
# HNSW graph parameters (approximate nearest neighbor search):
# hnsw_m = max connections per node per layer (layer 0 gets 2×M)
# hnsw_ef_construction = beam width during index build
# hnsw_ef_search = beam width during query (higher = more accurate, slower)

[rag]
enabled = true
db_path = "data/rag_index.bin"
chunk_size = 60
chunk_overlap = 10
search_results = 5
min_similarity = 0.25
hybrid_weight_vector = 0.7
hybrid_weight_bm25 = 0.3
chunker_tool = "tools/chunker.py"
hnsw_m = 16
hnsw_ef_construction = 150
hnsw_ef_search = 64

# ── Models

[[models]]
filename = "qwen2.5-0.5b-instruct-q8_0.gguf"
name = "Qwen2.5 0.5B Instruct (Q8_0)"
family = "qwen"
gpu_layers = 15
context_size = 32768
temperature = 0.5
top_k = 30
top_p = 0.85
repeat_penalty = 1.1

