# Qwen 3.8-lineage: five effort modes, each in a thinking and an instruct
# flavour. reasoning_effort takes "low" | "medium" | "xhigh" | "einstein" |
# "spoon", with a leading "i" for instruct (thinking suppressed, zero
# reasoning tokens) — e.g. "ixhigh". Needs the 8GB tier to run unclamped; the
# smaller tiers clamp it and say so at load.
#
# How the tag reaches the model is decided at load from the GGUF's own chat
# template, read back from llama-server /props:
#   - templates that read `reasoning_effort` (DavidAU's "plusIQ" Q6/Q8 MTP
#     quants) get it as chat_template_kwargs;
#   - every other Qwen3 template gets the `{REASON:xxx}` prompt marker the
#     model is trained to honour. THIS FILE carries a stock template, so it
#     takes the marker route.
# enable_thinking rides chat_template_kwargs either way, so the
# thinking/instruct split works regardless of template.
#
# Sampling below is the vendor's "thinking mode, general tasks" recommendation.
# Switching to an instruct ("i"-prefixed) effort? Their instruct numbers are
# temperature = 0.7, top_p = 0.80, top_k = 20.
[[models]]
filename = "Qwen3.5-9B-abliterated-Q4_K_M.gguf"
name = "Qwen3.5 9B Abliterated (Q4_K_M)"
family = "qwen"
gpu_layers = 99
context_size = 262144    # the model's real ceiling, straight from the GGUF
                         # (qwen35.context_length). This is a bound, not a
                         # request: the planner sizes the window against free
                         # VRAM and lands far below it.
kv_factor = 0.5          # MEASURED, not guessed. This is a hybrid attention/SSM
                         # model (the GGUF carries qwen35.ssm.* keys), so most
                         # layers hold constant-size recurrent state rather than
                         # a growing KV cache, and it costs half what the generic
                         # per-token estimate assumes. Do not copy this to a
                         # conventional transformer — it would OOM the launch.
temperature = 1.0
top_k = 20
top_p = 0.95
repeat_penalty = 1.0
reasoning_effort = "xhigh"

