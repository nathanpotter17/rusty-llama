<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeWriter</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">
  <header id="toolbar">
    <span class="logo"><span class="logo-dot"></span>CodeWriter</span>
    <div class="toolbar-right">
      <span id="rag-badge" class="badge badge-idle" title="RAG index status">RAG off</span>
      <span id="model-badge" class="badge badge-idle">No model</span>
      <button id="settings-btn" class="icon-btn" title="Settings">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </div>
  </header>

  <main class="split-pane">
    <div class="pane pane-input">
      <div class="pane-header">
        <div class="select-wrap">
          <select id="lang-select">
            <option value="python">Python</option>
            <option value="javascript">JavaScript</option>
            <option value="typescript">TypeScript</option>
            <option value="rust">Rust</option>
            <option value="go">Go</option>
            <option value="java">Java</option>
            <option value="c++">C++</option>
            <option value="c">C</option>
            <option value="html">HTML</option>
            <option value="sql">SQL</option>
            <option value="bash">Bash</option>
          </select>
        </div>
        <div class="mode-toggle">
          <button class="mode-btn active" data-mode="write">Write</button>
          <button class="mode-btn" data-mode="review">Review</button>
        </div>
        <label class="rag-toggle" id="rag-toggle" title="Use RAG: retrieve relevant code chunks from the index before generating">
          <input type="checkbox" id="rag-checkbox">
          <span class="rag-toggle-label">RAG</span>
        </label>
        <button id="write-btn" class="primary-btn">Write &rarr;</button>
      </div>
      <textarea id="write-desc" class="desc-input" placeholder="Describe what you need..." rows="4" spellcheck="false"></textarea>

      <!-- File upload zone -->
      <div id="file-zone" class="file-zone">
        <div id="drop-area" class="drop-area">
          <div class="drop-dest-toggle">
            <button class="dest-btn active" data-dest="context">Context</button>
            <button class="dest-btn" data-dest="rag">RAG Index</button>
          </div>
          <svg class="drop-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          <span class="drop-text">Drop files or <label class="file-label" for="file-input">browse</label></span>
          <span class="drop-hint">.ts .js .rs .c .cpp .h .py .go .java .html .css .sql .sh .toml .json .md</span>
          <input type="file" id="file-input" multiple accept=".ts,.tsx,.js,.jsx,.rs,.c,.cpp,.h,.hpp,.py,.go,.java,.html,.css,.sql,.sh,.bash,.toml,.yaml,.yml,.json,.md,.txt,.rb,.swift,.kt,.cs,.lua,.zig,.asm,.s,.vue,.svelte,.astro,.graphql,.gql,.proto,.cmake,.mk,.makefile,.dockerfile,.xml,.ini,.cfg,.conf,.env,.gitignore,.hbs,.ejs,.pug,.scss,.sass,.less,.styl,.wasm,.wat">
        </div>

        <!-- Budget bar (context files only) -->
        <div id="budget-bar" class="budget-bar hidden">
          <div class="budget-row">
            <div class="budget-track">
              <div id="budget-fill" class="budget-fill"></div>
            </div>
            <span id="budget-label" class="budget-label"></span>
          </div>
          <div id="budget-detail" class="budget-detail"></div>
        </div>

        <!-- Context file list -->
        <div id="context-file-section" class="file-section hidden">
          <div class="file-section-header">
            <span class="file-section-label">Context</span>
            <span class="file-section-hint">sent with prompt</span>
          </div>
          <div id="context-file-list" class="file-list"></div>
        </div>

        <!-- RAG file list -->
        <div id="rag-file-section" class="file-section hidden">
          <div class="file-section-header">
            <span class="file-section-label rag-label">RAG</span>
            <span class="file-section-hint">indexed for semantic search</span>
            <button id="rag-index-btn" class="small-btn rag-index-btn" title="Index files into vector store">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
              Index
            </button>
            <span id="rag-index-status" class="rag-index-status"></span>
          </div>
          <div id="rag-file-list" class="file-list"></div>
        </div>
      </div>

      <textarea id="write-ctx" class="code-input" placeholder="Paste additional code context here (optional)..." spellcheck="false"></textarea>
    </div>
    <div class="pane pane-output">
      <div class="pane-header">
        <span class="pane-title">Output</span>
        <div id="context-info" class="context-info hidden"></div>
        <button id="copy-btn" class="small-btn hidden">Copy</button>
        <span id="stats" class="stats"></span>
      </div>
      <div id="output" class="output-area">
        <div class="placeholder-msg">Model output will appear here</div>
      </div>
    </div>
  </main>

  <!-- Settings overlay -->
  <div id="settings-overlay" class="overlay hidden">
    <div class="overlay-panel">
      <div class="overlay-header">
        <h3>Settings</h3>
        <button id="settings-close" class="icon-btn" title="Close">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="settings-body">
        <section>
          <h4>Model</h4>
          <div class="select-wrap select-wrap-full">
            <select id="model-select"></select>
          </div>
          <div class="model-actions">
            <button id="load-btn" class="primary-btn">Load Model</button>
            <button id="stop-btn" class="danger-btn">Stop</button>
          </div>
          <div id="llama-status" class="status-line" style="margin-top:12px"></div>
        </section>
        <section>
          <h4>Speculative Decoding</h4>
          <div class="select-wrap select-wrap-full">
            <select id="draft-select">
              <option value="">None (disabled)</option>
            </select>
          </div>
          <div class="param-grid" style="margin-top:10px">
            <label>Draft Max<input id="p-draft-max" type="number" value="10" min="2" max="32" step="1"></label>
            <label>Draft GPU Layers<input id="p-draft-ngl" type="number" value="99" min="0" max="99"></label>
          </div>
          <div id="draft-info" class="status-line" style="margin-top:10px"></div>
        </section>
        <section>
          <h4>Embed Server</h4>
          <div id="embed-status" class="status-line"></div>
          <div class="model-actions" style="margin-top:10px">
            <button id="embed-start-btn" class="primary-btn">Start</button>
            <button id="embed-stop-btn" class="danger-btn">Stop</button>
          </div>
        </section>
        <section>
          <h4>RAG Index</h4>
          <div id="rag-settings-status" class="status-line"></div>
          <div class="model-actions" style="margin-top:10px">
            <button id="rag-clear-btn" class="danger-btn">Clear Index</button>
          </div>
        </section>
        <section>
          <h4>Parameters</h4>
          <div class="param-grid">
            <label>GPU Layers<input id="p-ngl" type="number" value="20" min="0" max="99"></label>
            <label>Context<input id="p-ctx" type="number" value="4096" min="512" step="512"></label>
            <label>Temperature<input id="p-temp" type="number" value="0.7" min="0" max="2" step="0.05"></label>
            <label>Top-K<input id="p-topk" type="number" value="40" min="1" max="200"></label>
            <label>Top-P<input id="p-topp" type="number" value="0.9" min="0" max="1" step="0.05"></label>
            <label>Repeat Penalty<input id="p-rp" type="number" value="1.1" min="0.5" max="2" step="0.05"></label>
          </div>
          <button id="save-params-btn" class="small-btn" style="margin-top:12px">Apply Params</button>
        </section>
        <section>
          <h4>Usage</h4>
          <div id="usage-info" class="status-line"></div>
        </section>
      </div>
    </div>
  </div>
</div>
<script src="/script.js"></script>
</body>
</html>
